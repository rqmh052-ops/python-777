name: py_runner
description: واجهة تطبيق تشغيل سكربتات بايثون (نسخة تجريبية)
publish_to: "none"
version: 7.1.0+710

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  url_launcher: ^6.3.2
  # الجزء الأول B: الملفات والتخزين
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  file_picker: ^13.1.0
  shared_preferences: ^2.5.3
  device_info_plus: ^13.1.0
  google_sign_in: ^7.2.0

flutter:
  uses-material-design: true
  # خط Tajawal (ترخيص OFL): 400 عادي، 700 عريض، 800 ثقيل
  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Regular.ttf
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: fonts/Tajawal-ExtraBold.ttf
          weight: 800
