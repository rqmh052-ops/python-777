name: Build Bayan APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Python runtime
        run: |
          python -m py_compile bayan_runtime.py tools/test_runtime.py
          python tools/test_runtime.py
          flutter --version

      - name: Generate Android shell
        run: |
          cp pubspec.yaml /tmp/bayan_pubspec.yaml
          rm -rf lib
          mkdir -p lib
          cp main.dart store.dart logo.dart python_runtime.dart script_runner.dart lib/
          cp -r lib /tmp/bayan_lib
          flutter create . --platforms=android --project-name py_runner --org dev.pyrunner
          rm -rf lib
          cp -r /tmp/bayan_lib lib
          cp /tmp/bayan_pubspec.yaml pubspec.yaml
          # flutter create يولّد اختبار MyApp الافتراضي (يحتاج flutter_test) وملف
          # analysis_options.yaml يشير إلى flutter_lints، وكلاهما غير موجود في pubspec.yaml
          rm -rf test
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude:
              - build/**
              - test/**
          EOF

      - name: Configure Chaquopy and Android
        run: python tools/prepare_android.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Build release APK
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bayan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: bayan-debug-symbols
          path: build/symbols
          if-no-files-found: error
          retention-days: 14
