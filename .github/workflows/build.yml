name: Build Bynux APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js for Cloudflare Worker tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test private cloud API
        run: node tools/test_worker.mjs

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # مثبّت عمدًا: يمنع تغيّر Flutter/AGP/Kotlin فجأة بين بناء وآخر.
          # لا تغيّره إلا عند الحاجة، ثم اختبر بناءً واحدًا.
          flutter-version: "3.47.4"
          cache: true

      - name: Validate Python runtime
        run: |
          python -m py_compile bayan_runtime.py tools/test_runtime.py tools/test_extra.py tools/verify_apk.py tools/prepare_android.py
          python tools/test_runtime.py
          python tools/test_extra.py
          flutter --version

      - name: Generate Android shell
        run: |
          cp pubspec.yaml /tmp/bayan_pubspec.yaml
          rm -rf lib
          mkdir -p lib
          cp main.dart store.dart logo.dart python_runtime.dart script_runner.dart account_cloud.dart lib/
          cp -r lib /tmp/bayan_lib
          flutter create . --platforms=android --project-name app --org com.bynux
          rm -rf lib
          cp -r /tmp/bayan_lib lib
          cp /tmp/bayan_pubspec.yaml pubspec.yaml
          # flutter create يولّد اختبار MyApp الافتراضي (يحتاج flutter_test) وملف
          # analysis_options.yaml يشير إلى flutter_lints، وكلاهما غير موجود في pubspec.yaml
          rm -rf test
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude:
              - build/**
              - test/**
          EOF

      - name: Configure Chaquopy and Android
        run: python tools/prepare_android.py

      - name: Prepare stable Android signing key
        env:
          BYNUX_KEYSTORE_BASE64: ${{ secrets.BYNUX_KEYSTORE_BASE64 }}
          BYNUX_KEYSTORE_PASSWORD: ${{ secrets.BYNUX_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$BYNUX_KEYSTORE_BASE64" ] && [ -n "$BYNUX_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$BYNUX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bynux-release.jks"
            echo "BYNUX_KEYSTORE_PATH=$RUNNER_TEMP/bynux-release.jks" >> "$GITHUB_ENV"
            echo "BYNUX_KEYSTORE_PASSWORD=$BYNUX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable Bynux signing key configured."
          else
            echo "Signing secrets are not configured; this build will use Flutter's temporary debug signing key. Google Sign-In will not be stable until both secrets are added."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      # --no-shrink ضروري: R8 يعيد تسمية كلاسات Kotlin (مثل RunCallback -> y0) ويحذف
      # دوال emitState/emitPackage لأن بايثون وحده يستدعيها، فتفشل كل السكربتات والمكتبات.
      - name: Build release APK
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: flutter build apk --release --no-shrink --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # يفشل البناء فورًا إذا حذف R8 دوال Kotlin التي يستدعيها بايثون
      # (بدلاً من اكتشاف الخطأ "'y0' object has no attribute" على الهاتف).
      # لا يوقف الرفع: يبقى الـ APK متاحًا للتحليل، لكن الـ job ينتهي أحمر (آخر خطوة) إن كان ناقصًا.
      - name: Verify Kotlin callbacks survived R8
        id: verify
        continue-on-error: true
        run: python tools/verify_apk.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bynux-7.1-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: bayan-debug-symbols
          path: build/symbols
          if-no-files-found: error
          retention-days: 14

      - name: Fail the build if the Kotlin callbacks were removed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "R8 removed the Kotlin callbacks - do NOT install this APK (it shows 'y0 object has no attribute')."
          exit 1
